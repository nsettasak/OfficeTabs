[package]
name = "officetabs-native"
version = "0.33.0"
edition = "2021"
license = "MIT"
authors = ["OfficeTabs"]

[lib]
name = "officetabs"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_ApplicationInstallationAndServicing"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

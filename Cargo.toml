[package]
name = "officetabs-native"
version = "0.33.2"
edition = "2021"
license = "MIT"
authors = ["OfficeTabs"]
description = "Native document tabs for Microsoft Word and Excel on Windows"
repository = "https://github.com/nsettasak/OfficeTabs"
keywords = ["office", "word", "excel", "com", "tabs"]
categories = ["gui"]
publish = false
build = "build.rs"

[lib]
name = "officetabs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "manager"
path = "src/bin/manager.rs"

[[bin]]
name = "setup"
path = "src/bin/setup/main.rs"

# Integration tests live next to the code they cover; Cargo is told where.
[[test]]
name = "model"
path = "tests/model.rs"

[[test]]
name = "com"
path = "tests/com.rs"

[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_ApplicationInstallationAndServicing"] }

[profile.release]
lto = true
codegen-units = 1
# Unwinding, not abort: src/guard.rs catches panics at the Office and Win32
# boundaries, so a bug in this add-in cannot take Word or Excel down with it.
panic = "unwind"
strip = "debuginfo"
